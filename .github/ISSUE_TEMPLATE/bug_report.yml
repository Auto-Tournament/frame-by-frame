name: Bug report
description: Something in Frame by Frame is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: CS2 build (`version` in the game console) and the Frame by Frame release you installed.
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Frame by Frame console lines
      render: text
  - type: textarea
    id: log
    attributes:
      label: Game console log
      description: The lines around the problem. Remove passwords and tokens.
      render: text
