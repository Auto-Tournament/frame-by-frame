<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Frame by Frame: CS2 renders each frame, the recorder converts and encodes it into a clip</title>
  <style>
    /* Auto Tournament's Ember palette: dark first, a warm light version for light mode */
    .bg { fill: #faf6f4; }
    .dot { fill: #e6dcd8; }
    .ln, .m, .slot, .scr, .card, .clip, .arm, .tray, .roll, .stick { stroke: #2a2220; stroke-width: 1.2; stroke-linejoin: round; }
    .m, .scr, .slot, .card, .clip { fill: #ffffff; }
    .stick, .arm, .tray, .roll { fill: #f1e9e6; }
    .belt { fill: #f1e9e6; stroke: #2a2220; stroke-width: 1.2; }
    .tread { stroke: #2a2220; stroke-opacity: .3; stroke-width: 44; stroke-dasharray: 1.2 10.8; fill: none; animation: belt .12s linear infinite; }
    .thin { fill: none; stroke: #2a2220; stroke-width: 1; stroke-linecap: round; }
    .hint { fill: none; stroke: #938a87; stroke-width: 1; stroke-dasharray: 3 4; }
    .t { fill: #2a2220; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .s { fill: #6b625f; font-size: 10.5px; }
    .k { fill: #2a2220; font-size: 9px; }
    .num { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .badge { fill: #d1512c; }
    .pipe { fill: none; stroke: #e6dcd8; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .audio { fill: none; stroke: #d1512c; stroke-width: 2; stroke-dasharray: 2 8; stroke-linecap: round; animation: flow .5s linear infinite; }
    .ledo { fill: #e6dcd8; }
    .on { fill: #d1512c; opacity: 0; animation: blink 1.5s linear infinite; }
    .rec { fill: #1f9d4c; animation: rec 1s steps(2) infinite; }
    .play { fill: #d1512c; }
    .glow { fill: url(#glow); }
    .dial { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #100908; }
      .dot { fill: #322926; }
      .ln, .m, .slot, .scr, .card, .clip, .arm, .tray, .roll, .stick, .belt { stroke: #c4bcb9; stroke-opacity: .85; }
      .m, .scr, .slot, .card, .clip { fill: #100908; }
      .stick, .arm, .tray, .roll, .belt { fill: #18110e; }
      .tread, .thin { stroke: #c4bcb9; }
      .hint { stroke: #4d4442; }
      .t, .k { fill: #f4edeb; }
      .s { fill: #938a87; }
      .badge { fill: #ff6a3d; }
      .num { fill: #140e0c; }
      .pipe { stroke: #211815; }
      .audio { stroke: #ff6a3d; }
      .on { fill: #ff6a3d; }
      .ledo { fill: #322926; }
      .rec { fill: #3fc168; }
      .play { fill: #ff6a3d; }
    }
    @keyframes belt { to { stroke-dashoffset: -12; } }
    @keyframes flow { to { stroke-dashoffset: -10; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 25% { opacity: 1; } 26%, 100% { opacity: 0; } }
    @keyframes rec { to { opacity: .2; } }

    /* a frame rides from CS2 (x 120) to the clip tray (x 845) in 6 s; four of them, 1.5 s apart */
    .f, .f > g { animation-duration: 6s; animation-timing-function: linear; animation-iteration-count: infinite; }
    .f { animation-name: ride; }
    .tga { animation-name: tga; } .yuv { animation-name: yuv; } .mp4 { animation-name: mp4; }
    .f1, .f1 > g { animation-delay: -1.5s; } .f2, .f2 > g { animation-delay: -3s; } .f3, .f3 > g { animation-delay: -4.5s; }
    @keyframes ride {
      0% { transform: translate(0, -22px) scale(.9); opacity: 0; }
      5% { transform: translate(36px, 0); opacity: 1; }
      94% { opacity: 1; }
      100% { transform: translate(725px, 0); opacity: 0; }
    }
    @keyframes tga { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
    @keyframes yuv { 0%, 46% { opacity: 0; } 47%, 70% { opacity: 1; } 71%, 100% { opacity: 0; } }
    @keyframes mp4 { 0%, 70% { opacity: 0; } 71%, 100% { opacity: 1; } }
    /* a lamp flashes as a frame passes under its arm */
    .l2 { animation-delay: 1.41s; } .l3 { animation-delay: 1.31s; } .l4 { animation-delay: 1.22s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .f1, .f2, .f3 { display: none; } }
  </style>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="dot" cx="1" cy="1" r="1"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff6a3d" stop-opacity=".45"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
  </defs>

  <rect class="bg" width="900" height="290" rx="12"/>
  <rect width="900" height="290" rx="12" fill="url(#grid)"/>

  <!-- game audio: CS2's WAV, piped along the top to the encoder -->
  <path class="pipe" d="M150,52 V26 H630 V52"/>
  <path class="audio" d="M150,52 V26 H630 V52"/>
  <text class="s" x="390" y="20" text-anchor="middle">game audio (WAV)</text>

  <!-- arms from each machine out over the belt, each with a lamp -->
  <g>
    <rect class="arm" x="113" y="118" width="14" height="40" rx="2"/>
    <rect class="arm" x="283" y="118" width="14" height="40" rx="2"/>
    <rect class="arm" x="453" y="118" width="14" height="40" rx="2"/>
    <rect class="arm" x="623" y="118" width="14" height="40" rx="2"/>
  </g>

  <!-- 1 CS2: renders the demo one frame at a time -->
  <rect class="m" x="70" y="52" width="100" height="70" rx="6"/>
  <rect class="scr" x="80" y="62" width="64" height="42" rx="2"/>
  <path class="thin" d="M84,94 L98,86 L110,90 L140,76 M124,68 v10 M119,73 h10"/>
  <circle class="rec" cx="158" cy="64" r="3.5"/>
  <text class="k" x="80" y="116">frame 4096</text>

  <!-- 2 RAM: TGA frames in /dev/shm -->
  <rect class="m" x="235" y="52" width="110" height="70" rx="6"/>
  <g>
    <rect class="stick" x="245" y="60" width="9" height="54" rx="1"/>
    <rect class="stick" x="258" y="60" width="9" height="54" rx="1"/>
    <rect class="stick" x="271" y="60" width="9" height="54" rx="1"/>
    <rect class="stick" x="284" y="60" width="9" height="54" rx="1"/>
    <rect class="stick" x="297" y="60" width="9" height="54" rx="1"/>
    <rect class="stick" x="310" y="60" width="9" height="54" rx="1"/>
    <rect class="stick" x="323" y="60" width="9" height="54" rx="1"/>
  </g>

  <!-- 3 Convert: TGA to raw video, as frames arrive -->
  <rect class="m" x="410" y="52" width="100" height="70" rx="6"/>
  <g class="dial">
    <circle class="ln" cx="460" cy="85" r="24" fill="none"/>
    <circle class="thin" cx="460" cy="85" r="18" stroke-width="4" stroke-dasharray="1 4.65"/>
    <path class="thin" d="M460,85 L460,65"/>
  </g>
  <circle class="ln" cx="460" cy="85" r="5" fill="none"/>

  <!-- 4 Encode: the best codec the GPU has, plus the audio -->
  <rect class="m" x="575" y="52" width="110" height="70" rx="6"/>
  <g>
    <rect class="slot" x="584" y="62" width="28" height="34" rx="2"/>
    <rect class="slot" x="616" y="62" width="28" height="34" rx="2"/>
    <rect class="slot" x="648" y="62" width="28" height="34" rx="2"/>
    <text class="k" x="598" y="111" text-anchor="middle">AV1</text>
    <text class="k" x="630" y="111" text-anchor="middle">H.265</text>
    <text class="k" x="662" y="111" text-anchor="middle">H.264</text>
    <path class="hint" d="M598,79 v0 M612,79 H616 M644,79 H648"/>
  </g>

  <!-- the belt -->
  <rect class="belt" x="60" y="152" width="760" height="48" rx="6"/>
  <path class="tread" d="M66,176 H814"/>
  <rect class="roll" x="54" y="148" width="10" height="56" rx="3"/>
  <rect class="roll" x="816" y="148" width="10" height="56" rx="3"/>

  <!-- 5 the clip tray -->
  <rect class="tray" x="834" y="140" width="56" height="72" rx="6"/>
  <rect class="clip" x="842" y="150" width="40" height="26" rx="3"/>
  <rect class="clip" x="842" y="160" width="40" height="26" rx="3"/>
  <rect class="clip" x="842" y="170" width="40" height="26" rx="3"/>
  <path class="play" d="M857,177 L857,189 L867,183 z"/>

  <!-- frames: a game frame, then raw video, then a clip -->
  <g transform="translate(120,176)">
    <g class="f f0">
      <ellipse class="glow" rx="40" ry="26"/>
      <g class="tga"><rect class="card" x="-20" y="-14" width="40" height="28" rx="2"/><path class="thin" d="M-16,8 L-6,3 L2,6 L16,-2 M8,-10 v8 M4,-6 h8"/></g>
      <g class="yuv"><rect class="card" x="-20" y="-14" width="40" height="28" rx="2"/><path class="thin" d="M-15,-7 H15 M-15,0 H15 M-15,7 H15"/></g>
      <g class="mp4"><rect class="card" x="-14" y="-10" width="28" height="20" rx="3"/><path class="play" d="M-4,-5 L-4,5 L5,0 z"/></g>
    </g>
    <g class="f f1">
      <ellipse class="glow" rx="40" ry="26"/>
      <g class="tga"><rect class="card" x="-20" y="-14" width="40" height="28" rx="2"/><path class="thin" d="M-16,8 L-6,3 L2,6 L16,-2 M8,-10 v8 M4,-6 h8"/></g>
      <g class="yuv"><rect class="card" x="-20" y="-14" width="40" height="28" rx="2"/><path class="thin" d="M-15,-7 H15 M-15,0 H15 M-15,7 H15"/></g>
      <g class="mp4"><rect class="card" x="-14" y="-10" width="28" height="20" rx="3"/><path class="play" d="M-4,-5 L-4,5 L5,0 z"/></g>
    </g>
    <g class="f f2">
      <ellipse class="glow" rx="40" ry="26"/>
      <g class="tga"><rect class="card" x="-20" y="-14" width="40" height="28" rx="2"/><path class="thin" d="M-16,8 L-6,3 L2,6 L16,-2 M8,-10 v8 M4,-6 h8"/></g>
      <g class="yuv"><rect class="card" x="-20" y="-14" width="40" height="28" rx="2"/><path class="thin" d="M-15,-7 H15 M-15,0 H15 M-15,7 H15"/></g>
      <g class="mp4"><rect class="card" x="-14" y="-10" width="28" height="20" rx="3"/><path class="play" d="M-4,-5 L-4,5 L5,0 z"/></g>
    </g>
    <g class="f f3">
      <ellipse class="glow" rx="40" ry="26"/>
      <g class="tga"><rect class="card" x="-20" y="-14" width="40" height="28" rx="2"/><path class="thin" d="M-16,8 L-6,3 L2,6 L16,-2 M8,-10 v8 M4,-6 h8"/></g>
      <g class="yuv"><rect class="card" x="-20" y="-14" width="40" height="28" rx="2"/><path class="thin" d="M-15,-7 H15 M-15,0 H15 M-15,7 H15"/></g>
      <g class="mp4"><rect class="card" x="-14" y="-10" width="28" height="20" rx="3"/><path class="play" d="M-4,-5 L-4,5 L5,0 z"/></g>
    </g>
  </g>

  <!-- lamps at the arm ends, over the belt (drawn over the frames) -->
  <g>
    <circle class="ledo" cx="120" cy="152" r="4"/><circle class="on" cx="120" cy="152" r="4"/>
    <circle class="ledo" cx="290" cy="152" r="4"/><circle class="on l2" cx="290" cy="152" r="4"/>
    <circle class="ledo" cx="460" cy="152" r="4"/><circle class="on l3" cx="460" cy="152" r="4"/>
    <circle class="ledo" cx="630" cy="152" r="4"/><circle class="on l4" cx="630" cy="152" r="4"/>
  </g>

  <!-- step labels -->
  <g>
    <circle class="badge" cx="80" cy="228" r="8"/><text class="num" x="80" y="232" text-anchor="middle">1</text>
    <text class="t" x="94" y="232">RENDER</text><text class="s" x="94" y="247">CS2, frame by frame</text>
    <circle class="badge" cx="250" cy="228" r="8"/><text class="num" x="250" y="232" text-anchor="middle">2</text>
    <text class="t" x="264" y="232">RAM</text><text class="s" x="264" y="247">TGA in /dev/shm</text>
    <circle class="badge" cx="420" cy="228" r="8"/><text class="num" x="420" y="232" text-anchor="middle">3</text>
    <text class="t" x="434" y="232">CONVERT</text><text class="s" x="434" y="247">TGA to raw video</text>
    <circle class="badge" cx="590" cy="228" r="8"/><text class="num" x="590" y="232" text-anchor="middle">4</text>
    <text class="t" x="604" y="232">ENCODE</text><text class="s" x="604" y="247">best codec + audio</text>
    <circle class="badge" cx="770" cy="228" r="8"/><text class="num" x="770" y="232" text-anchor="middle">5</text>
    <text class="t" x="784" y="232">CLIPS</text><text class="s" x="784" y="247">MP4</text>
  </g>
  <text class="s" x="450" y="276" text-anchor="middle">Each frame takes as long as the GPU needs, so a slow GPU makes the same clip as a fast one. It just takes longer.</text>
</svg>
