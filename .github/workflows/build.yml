name: Build

# Builds libserver.so in Valve's Steam Runtime 3 "sniper" SDK (what CS2 targets)
# and runs the tests. Every run uploads frame-by-frame-<version>-linuxsteamrt64.zip;
# tags vX.Y.Z (or vX.Y.Z-beta.N) also publish it as a GitHub release.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          cd build && ctest --output-on-failure

      - name: Package
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          [ "${GITHUB_REF_TYPE}" = tag ] && version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/frame-by-frame/bin/linuxsteamrt64
          cp build/libserver.so dist/frame-by-frame/bin/linuxsteamrt64/
          cp LICENSE dist/frame-by-frame/
          (cd dist && cmake -E tar cf "frame-by-frame-${version}-linuxsteamrt64.zip" --format=zip frame-by-frame)

      - uses: actions/upload-artifact@v4
        with:
          name: frame-by-frame
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frame-by-frame
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          prerelease: ${{ contains(github.ref_name, '-') }}
